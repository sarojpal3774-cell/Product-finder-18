<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            background-color: aqua;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: black;
            font-size: 40px;
        }

        label {
            font-size: 18px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            margin-top: 8px;
            border: 2px solid black;
            border-radius: 8px;
            font-size: 16px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        button {
            padding: 12px 35px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: red;
        }

        #message {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Login</h1>

    <label for="name">Name</label>
    <br>
    <input id="name" type="text" placeholder="Write your name">

    <br><br>

    <label for="email">Email</label>
    <br>
    <input id="email" type="email" placeholder="Write your email">

    <br><br>

    <label for="password">Password</label>
    <br>
    <input id="password" type="password" placeholder="Write your password">

    <br><br>

    <label for="dob">Date of Birth</label>
    <br>
    <input id="dob" type="date">

    <br><br>

    <input id="terms" type="checkbox">
    <label for="terms">Terms and Policy</label>

    <br><br>

    <button type="button" onclick="login()">
        Submit
    </button>

    <p id="message"></p>


    <script>

        function login() {

            let name =
                document.getElementById("name").value;

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;

            let dob =
                document.getElementById("dob").value;

            let terms =
                document.getElementById("terms").checked;


            if (
                name === "" ||
                email === "" ||
                password === "" ||
                dob === "" ||
                terms === false
            ) {

                document.getElementById("message").innerText =
                    "Please fill all details ❌";

                return;
            }


            localStorage.setItem("loggedIn", "true");


            document.getElementById("message").innerText =
                "Login Successful ✅";


            setTimeout(function() {

                window.location.href = "index.html";

            }, 500);

        }

    </script>

</body>
</html>
